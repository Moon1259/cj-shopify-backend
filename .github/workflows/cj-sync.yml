name: CJ Auto Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Sync
        run: |
          curl -X POST https://cj-shopify-backend.onrender.com/cron/sync \
          -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
