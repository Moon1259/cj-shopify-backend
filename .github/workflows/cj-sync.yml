name: CJ Auto Sync 500

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and Sync 500 products
        run: |
          echo "Waking Render (free instance 50s delay)..."
          curl -s -m 90 https://cj-shopify-backend.onrender.com/ > /dev/null || true
          sleep 60
          echo "Triggering sync 40 products..."
          curl -X POST "https://cj-shopify-backend.onrender.com/cron/sync?count=40" \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            --max-time 900
          echo "Done"
